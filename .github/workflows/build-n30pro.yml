name: Build OpenWrt 25.12.5 Netcore N30 Pro

on:
  workflow_dispatch:

env:
  OPENWRT_VERSION: v25.12.5
  OPENWRT_REPO: https://github.com/openwrt/openwrt.git
  PATCH_REPO: https://github.com/liuyi-htu/Netcore-N30-Pro-patch-for-OpenWrt.git

jobs:

  build:

    runs-on: ubuntu-24.04


    steps:


    - name: Checkout
      uses: actions/checkout@v4



    - name: Install dependencies
      run: |

        sudo apt update

        sudo apt install -y \
          build-essential \
          clang \
          flex \
          bison \
          gawk \
          gettext \
          git \
          libncurses-dev \
          libssl-dev \
          python3 \
          python3-setuptools \
          rsync \
          unzip \
          wget \
          file \
          zlib1g-dev \
          ccache



    - name: Clone OpenWrt 25.12.5
      run: |

        git clone \
          --depth=1 \
          --branch ${OPENWRT_VERSION} \
          ${OPENWRT_REPO} \
          openwrt



    - name: Clone N30 Pro adaptation patch
      run: |

        git clone \
          --depth=1 \
          ${PATCH_REPO} \
          n30pro-patch



    - name: Apply N30 Pro patch
      working-directory: openwrt
      run: |

        bash ../n30pro-patch/scripts/apply-netcore-n30pro.sh \
          ../n30pro-patch



    - name: Add PassWall feeds
      working-directory: openwrt
      run: |

        echo "src-git passwall_packages https://github.com/xiaorouji/openwrt-passwall-packages.git" \
        >> feeds.conf.default


        echo "src-git passwall https://github.com/xiaorouji/openwrt-passwall.git" \
        >> feeds.conf.default



    - name: Update feeds
      working-directory: openwrt
      run: |

        ./scripts/feeds update -a

        ./scripts/feeds install -a



    - name: Configure target
      working-directory: openwrt
      run: |

        cat > .config <<'EOF'

CONFIG_TARGET_mediatek=y
CONFIG_TARGET_mediatek_filogic=y

CONFIG_TARGET_mediatek_filogic_DEVICE_netcore_n30-pro=y


CONFIG_TARGET_ROOTFS_SQUASHFS=y


CONFIG_PACKAGE_luci=y
CONFIG_PACKAGE_luci-ssl=y


EOF


        make defconfig



    - name: Add packages
      working-directory: openwrt
      run: |

        cat >> .config <<'EOF'


# PassWall

CONFIG_PACKAGE_luci-app-passwall=y

CONFIG_PACKAGE_xray-core=y

CONFIG_PACKAGE_sing-box=y

CONFIG_PACKAGE_chinadns-ng=y

CONFIG_PACKAGE_dns2socks=y

CONFIG_PACKAGE_tcping=y

CONFIG_PACKAGE_ip-full=y


# PassWall kernel

CONFIG_PACKAGE_kmod-nft-socket=y

CONFIG_PACKAGE_kmod-nft-tproxy=y

CONFIG_PACKAGE_kmod-tun=y



# MWAN3

CONFIG_PACKAGE_mwan3=y

CONFIG_PACKAGE_luci-app-mwan3=y



# Samba

CONFIG_PACKAGE_samba4-server=y

CONFIG_PACKAGE_luci-app-samba4=y



# USB xHCI

CONFIG_PACKAGE_kmod-usb3=y

CONFIG_PACKAGE_kmod-usb-xhci-hcd=y

CONFIG_PACKAGE_kmod-usb-xhci-mtk=y



# USB storage

CONFIG_PACKAGE_kmod-usb-storage=y

CONFIG_PACKAGE_kmod-fs-ext4=y

CONFIG_PACKAGE_kmod-fs-vfat=y

CONFIG_PACKAGE_block-mount=y

CONFIG_PACKAGE_e2fsprogs=y



# USB modem

CONFIG_PACKAGE_kmod-usb-net=y

CONFIG_PACKAGE_kmod-usb-net-cdc-ether=y

CONFIG_PACKAGE_kmod-usb-net-cdc-ncm=y

CONFIG_PACKAGE_kmod-usb-net-qmi-wwan=y

CONFIG_PACKAGE_kmod-usb-net-cdc-mbim=y

CONFIG_PACKAGE_kmod-usb-net-rndis=y


CONFIG_PACKAGE_kmod-usb-serial=y

CONFIG_PACKAGE_kmod-usb-serial-option=y

CONFIG_PACKAGE_kmod-usb-serial-wwan=y

CONFIG_PACKAGE_kmod-usb-wdm=y


CONFIG_PACKAGE_uqmi=y

CONFIG_PACKAGE_umbim=y

CONFIG_PACKAGE_usb-modeswitch=y


EOF


        make defconfig



    - name: Verify N30 Pro target
      working-directory: openwrt
      run: |

        grep \
        "CONFIG_TARGET_mediatek_filogic_DEVICE_netcore_n30-pro" \
        .config



    - name: Verify USB support
      working-directory: openwrt
      run: |

        grep CONFIG_PACKAGE_kmod-usb3 .config

        grep CONFIG_PACKAGE_kmod-usb-xhci-mtk .config



    - name: Download
      working-directory: openwrt
      run: |

        make download -j$(nproc)



    - name: Compile
      working-directory: openwrt
      run: |

        make -j$(nproc) V=s



    - name: Collect firmware
      working-directory: openwrt
      run: |

        mkdir output


        find bin/targets \
        -type f \
        \( \
        -name "*n30*" \
        -o \
        -name "*netcore*" \
        -o \
        -name "*.manifest" \
        \) \
        -exec cp {} output/ \;


        cp .config output/config



    - name: Upload firmware
      uses: actions/upload-artifact@v4

      with:

        name: OpenWrt-25.12.5-Netcore-N30-Pro

        path: openwrt/output

        retention-days: 30
